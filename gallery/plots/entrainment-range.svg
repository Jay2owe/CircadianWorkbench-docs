rved. the stimuli cover only 33% of the circadian cycle, so the fit is extrapolated across the rest and its zones are predictions rather than measurements. the stimuli cover only 33% of the circadian cycle, so the fit is extrapolated across the rest and its zones are predictions rather than measurements The curve&amp;#x27;s amplitude alone would allow 22.00-26.00 h, which is wider than the range reported. The outermost cycle lengths are set by amplitude alone -- the curve&amp;#x27;s extreme is where its slope is zero -- so a gap here means the curve&amp;#x27;s stated max_advance_hours and max_delay_hours do not match its own fitted coefficients. 26 of the 39 entrained cycle lengths settle at a circadian time where no stimulus was ever given, so their phase angle is read off the fit between measured points rather than measured. `nearest_probe_hours` says how far..</desc><rect x="0" y="680" width="1200" height="62" fill="#ffffff"/><text class="legend" x="82.00" y="711.00" text-anchor="start"><tspan x="82.00" dy="-1.10em">Entrains between 22.1 and 25.9 h. Predicted from the animal&#x27;s measured phase response curve, not observed. the stimuli cover only 33% of the circadian</tspan><tspan x="82.00" dy="1.1em">cycle, so the fit is extrapolated across the rest and its zones are predictions rather than measurements. the stimuli cover only 33% of the circadian</tspan><tspan x="82.00" dy="1.1em">cycle, so the fit is extrapolated across the rest and its zones are predictions rather than measurements The curve&amp;#x27;s amplitude alone would allow ...</tspan></text></svg>