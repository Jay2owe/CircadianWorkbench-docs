ays. 0.96x the control mean, p = 0.409. the rank test beside it could not go below p = 0.25. No verdict. The</tspan><tspan x="82.00" dy="1.1em">pulse window sat within the spread of its 7 control days (p = 0.409). A null on this many control days is weak evidence of no effect rather than</tspan><tspan x="82.00" dy="1.1em">evidence of none; the rank test beside it could not have gone below p = 0.25 whatever the animal did.</tspan></text></svg>