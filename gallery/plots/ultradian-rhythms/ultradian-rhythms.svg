<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Ultradian component">
<metadata>
  <fig:figure-record xmlns:fig="https://reprofig.org/ns/figure-record/1" schema="reprofig/1" encoding="gzip+base64"></fig:figure-record>
</metadata><style>text{font-family:Arial,Helvetica,sans-serif;fill:#000000;font-weight:400}.title{font-size:20px;font-weight:700}.axis{font-size:22px;font-weight:400}.tick{font-size:20px;fill:#000000;font-weight:400}.legend{font-size:15px;font-weight:400}.grid{stroke:#dfe4ea;stroke-width:1}.frame{stroke:#000000;stroke-width:2;fill:none}.spine{stroke:#000000;stroke-width:2;fill:none;stroke-linecap:square}.tickmark{stroke:#000000;stroke-width:2;stroke-linecap:square}</style><rect width="1200" height="680" fill="#ffffff"/><text class="title" x="82.00" y="38.00" text-anchor="start">Ultradian component</text><text x="600.0" y="340.0" text-anchor="middle" class="axis">Sampled every 30 minutes, this record resolves periods down to 4 h at 8 samples per cycle, and the band starts at 2 h (ultradian_min_hours). Raise the band&amp;#x27;s lower edge to at least 4 h, or lower ultradian_min_samples_per_cycle if a coarser peak is what you mean.</text></svg>