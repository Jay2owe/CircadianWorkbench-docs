ord. Fitted two-process model, not a measurement: sleep pressure against a circadian threshold, with the parameters the record could not separate reported as a range. The 2 independent searches disagree about how well this record can be fitted at all: their best mismatches spread by 0.028, wider than the 0.02 the record itself cannot resolve. The search has not converged, so the ranges below are the optimiser&amp;#x27;s scatter rather than the record&amp;#x27;s, and no identifiability verdict can be read off them. Raise two_process_max_iterations. This animal&amp;#x27;s days barely differ from each other (scatter 0.000), so beating that scatter is a bar almost nothing clears and fits_better_than_noise is not informative here. Read the mismatch instead. The model&amp;#x27;s error on the hourly sleep fraction (0.153) is not smaller than the measurement&amp;#x27;s own day-to-day scatter (0.000), so it has not been shown to describe this record any better than the record&amp;#x27;s noise does..</desc><rect x="0" y="680" width="1200" height="62" fill="#ffffff"/><text class="legend" x="82.00" y="711.00" text-anchor="start"><tspan x="82.00" dy="-1.10em">Fitted, the search did not converge; the model classifies 2.8% of samples differently from the record. Fitted two-process model, not a measurement:</tspan><tspan x="82.00" dy="1.1em">sleep pressure against a circadian threshold, with the parameters the record could not separate reported as a range. The 2 independent searches</tspan><tspan x="82.00" dy="1.1em">disagree about how well this record can be fitted at all: their best mismatches spread by 0.028, wider than the 0.02 the record itself cannot resolve ...</tspan></text></svg>